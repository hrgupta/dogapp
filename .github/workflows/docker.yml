# Builds the Docker image and runs a dependency smoke test.
# Covers the gap: previously the image was only ever built locally.

name: Docker Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dogapp:ci .

      - name: Smoke test
        run: docker run --rm dogapp:ci python -c "import keras, torch, fastapi, streamlit; print('dogapp image OK')"
